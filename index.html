<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>超时空辉夜姬 | 三轨跑酷</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: #0a0620;
        }
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0620;
            padding-top: env(safe-area-inset-top);
            box-sizing: border-box;
        }
        .canvas-area {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0620;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0a0620;
        }
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a1338 0%, #0c0820 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; }
        .loading-title { font-size: clamp(24px, 8vw, 48px); font-weight: bold; color: #FFF5E0; text-shadow: 0 0 20px #ff88aa; margin-bottom: 30px; font-family: monospace; }
        .loading-bar-container { width: 280px; height: 24px; background: rgba(0,0,0,0.5); border-radius: 30px; overflow: hidden; border: 2px solid #ffccaa; }
        .loading-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ffb7c5, #ff6f9f); border-radius: 30px; transition: width 0.2s ease; }
        .loading-text { color: #ffefc0; margin-top: 16px; font-size: 14px; font-family: monospace; }
        .start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a1338 0%, #0c0820 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 30; }
        .start-title { font-size: clamp(32px, 8vw, 70px); font-weight: bold; color: #FFF5E0; text-shadow: 0 0 30px #ff88aa, 0 0 50px #b56eff; margin-bottom: 20px; letter-spacing: 6px; font-family: monospace; text-align: center; }
        .start-sub { font-size: clamp(16px, 5vw, 24px); color: #ffefc0; margin-bottom: 50px; text-align: center; padding: 0 24px; }
        .start-btn, .restart-btn { background: linear-gradient(135deg, #ffb7c5, #ff6f9f); border: none; padding: 14px 56px; font-size: clamp(26px, 6vw, 44px); font-weight: bold; color: #2a1422; border-radius: 60px; cursor: pointer; box-shadow: 0 12px 0 #8b3a5a; transition: 0.08s linear; font-family: monospace; letter-spacing: 4px; }
        .start-btn:active, .restart-btn:active { transform: translateY(6px); box-shadow: 0 5px 0 #8b3a5a; }
        .bottom-controls { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 12px 28px calc(12px + env(safe-area-inset-bottom, 0)); background: transparent; z-index: 20; pointer-events: auto; display: none; }
        .left-buttons { display: flex; gap: 1.5rem; }
        .right-button { display: flex; }
        .ctrl-btn { width: 80px; height: 80px; border-radius: 50%; background: rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.5); font-size: 3.2rem; font-weight: bold; color: rgba(255,255,245,0.95); cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: 0.05s linear; }
        .ctrl-btn:active { transform: scale(0.93); background: rgba(0,0,0,0.4); }
        .music-toggle-btn { position: fixed; top: 8px; left: 8px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); border: 1px solid rgba(255,220,160,0.7); z-index: 40; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .fullscreen-tip { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 6px 18px; border-radius: 40px; color: #ffddbb; font-size: 12px; z-index: 25; pointer-events: none; white-space: nowrap; transition: opacity 0.5s; }
        .fullscreen-tip.fade-out { opacity: 0; }
        .rotate-tip {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000ee;
            backdrop-filter: blur(14px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffecb3;
            font-size: 26px;
            text-align: center;
            pointer-events: none;
        }
        .rotate-tip.hidden { display: none; }
        .rotate-icon {
            font-size: 60px;
            margin-bottom: 5px;
            animation: rotateHint 1.4s infinite ease;
        }
        .rotate-text {
            background: rgba(0,0,0,0.7);
            padding: 12px 32px;
            border-radius: 60px;
            font-size: 20px;
            border: 1px solid #ffcc88;
            margin-top: 5px;
        }
        .rotate-sub {
            font-size: 14px;
            margin-top: 12px;
            opacity: 0.8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .rotate-sub span {
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 20px;
        }
        @keyframes rotateHint { 0%,100%{ transform: rotate(0deg); } 40%{ transform: rotate(90deg); } 80%{ transform: rotate(90deg); } }
        @media (orientation: landscape) { .rotate-tip { display: none; } }
        @media (max-width: 850px) and (orientation: landscape) { .ctrl-btn { width: 70px; height: 70px; font-size: 2.8rem; } }
        .item-timer-bar { position: absolute; bottom: 100px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 45; pointer-events: none; flex-wrap: wrap; }
        .item-timer { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); padding: 6px 12px; border-radius: 30px; display: flex; align-items: center; gap: 8px; color: #FFF; font-size: 14px; font-family: monospace; }
        .item-timer-icon { width: 24px; height: 24px; display: inline-block; text-align: center; }
        .item-timer-bar-fill { width: 60px; height: 4px; background: #ffaa66; border-radius: 2px; transition: width 0.1s linear; }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="canvas-area">
        <canvas id="gameCanvas"></canvas>
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-title">✨ 超时空加载中 ✨</div>
            <div class="loading-bar-container"><div class="loading-bar" id="loadingBar"></div></div>
            <div class="loading-text" id="loadingText">等待资源加载...</div>
        </div>
        <div class="start-overlay" id="startOverlay" style="display: none;">
            <div class="start-title">✨ 超时空輝夜姬 ✨</div>
            <div class="start-sub">三轨跑酷 · 躲避陷阱收集星辉</div>
            <button class="start-btn" id="startBtn">时 空 启 程</button>
        </div>
        <div id="deathOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 35;">
            <div style="text-align: center;">
                <div style="font-size: 64px; color: #FF8866; text-shadow: 0 0 20px #ff4444; margin-bottom: 20px;">💀 游戏结束 💀</div>
                <div style="font-size: 48px; color: #FFD87A; margin-bottom: 10px;" id="finalScoreDisplay">得分: 0</div>
                <div style="font-size: 28px; color: #FFAA88; margin-bottom: 30px;" id="highScoreDisplay">最高分: 0</div>
                <button id="restartBtn" class="restart-btn" style="display: block; margin: 0 auto;">时 空 重 启</button>
            </div>
        </div>
    </div>
    <div class="bottom-controls" id="bottomControls">
        <div class="left-buttons"><button class="ctrl-btn left-btn">←</button><button class="ctrl-btn right-btn">→</button></div>
        <div class="right-button"><button class="ctrl-btn jump-btn">↑</button></div>
    </div>
    <button class="music-toggle-btn" id="musicToggleBtn">🔊</button>
    <div class="fullscreen-tip" id="fullscreenTip">✨ 横屏自动全屏 · 沉浸体验 ✨</div>
    <div class="item-timer-bar" id="itemTimerBar"></div>
</div>
<div class="rotate-tip" id="rotateTip">
    <div class="rotate-icon">📱🔄</div>
    <div class="rotate-text">请打开「自动旋转」<br>横屏获得最佳体验</div>
    <div class="rotate-sub">
        <span>👇 下拉状态栏 👇</span>
        <span style="font-size:12px;">打开“自动旋转”开关</span>
    </div>
</div>

<script>
(function(){
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');
    const deathOverlay = document.getElementById('deathOverlay');
    const restartBtn = document.getElementById('restartBtn');
    const finalScoreDisplay = document.getElementById('finalScoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingBar = document.getElementById('loadingBar');
    const loadingText = document.getElementById('loadingText');
    const gameContainer = document.getElementById('gameContainer');
    const fullscreenTip = document.getElementById('fullscreenTip');
    const bottomControls = document.getElementById('bottomControls');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const itemTimerBar = document.getElementById('itemTimerBar');
    
    const LOGIC_W = 1440;
    const LOGIC_H = 810;
    const GROUND_Y = 540;      // 地面Y坐标（实际平台）
    const GROUND_H = 40;       // 地面厚度
    
    // ========== 三条视觉辅助线（无碰撞，仅用于整齐摆放道具）==========
    // 下轨（陷阱线）- 与地面平齐
    const TRACK_LOWER_Y = GROUND_Y - 12;
    // 中轨（道具/障碍物线）
    const TRACK_MID_Y = GROUND_Y - 85;
    // 上轨（星星/道具线）
    const TRACK_UPPER_Y = GROUND_Y - 155;
    
    const TRACK_POSITIONS = [TRACK_LOWER_Y, TRACK_MID_Y, TRACK_UPPER_Y];
    const TRACK_NAMES = ["陷阱轨", "道具轨", "高空轨"];
    
    // ========== 游戏参数 ==========
    let gameRunning = false;
    let musicMuted = false;
    let resourcesLoaded = false;
    let score = 0;
    let highScore = localStorage.getItem('highScore') ? parseInt(localStorage.getItem('highScore')) : 0;
    let cameraX = 0;
    let lastGeneratedX = 0;
    let gameSpeed = 1.0;
    let extraJump = 0;
    
    // 世界物体
    let platforms = [];        // 地面平台
    let trackItems = [];       // 轨道物品 { x, y, type, track, w, h, collected, value }
    let movingPlatforms = [];
    let lavaPits = [];
    let springboards = [];
    
    // 玩家
    const PLAYER_W = 52;
    const PLAYER_H = 68;
    let player = {
        x: 200, y: GROUND_Y - PLAYER_H, w: PLAYER_W, h: PLAYER_H,
        vx: 0, vy: 0, speed: 6.2, jumpPower: -12.2,
        gravity: 0.62, onGround: true, facingRight: true
    };
    
    // 道具BUFF
    let activeBuffs = {
        fly: { active: false, endTime: 0 },
        magnet: { active: false, endTime: 0 },
        shield: { active: false, endTime: 0 },
        speed: { active: false, endTime: 0, multiplier: 1.5 },
        doubleScore: { active: false, endTime: 0 },
        doubleJump: { active: false, endTime: 0 }
    };
    
    let walkFrame = 0, walkAnimTimer = 0;
    let audioCtx = null, bgMusic = null;
    
    // ========== 美术资源（使用DataURI内嵌，确保稳定显示）==========
    // 背景渐变绘制（不再依赖外部图片）
    function drawStyledBackground() {
        // 星空渐变
        const grad = ctx.createLinearGradient(0, 0, 0, LOGIC_H);
        grad.addColorStop(0, '#0a0a2e');
        grad.addColorStop(0.5, '#1a1a4e');
        grad.addColorStop(1, '#2a1a3e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, LOGIC_W, LOGIC_H);
        
        // 绘制闪烁星星
        for(let i = 0; i < 200; i++) {
            let x = (i * 131) % LOGIC_W;
            let y = (i * 253) % (LOGIC_H - 100);
            let size = 1 + (i % 3);
            let alpha = 0.3 + Math.sin(Date.now() * 0.001 * (i % 10)) * 0.2;
            ctx.fillStyle = `rgba(255, 240, 200, ${alpha})`;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI*2);
            ctx.fill();
        }
        
        // 远处云朵
        ctx.fillStyle = "rgba(180, 160, 220, 0.15)";
        for(let i = 0; i < 8; i++) {
            let cloudX = (cameraX * 0.2 + i * 300) % (LOGIC_W + 400) - 200;
            ctx.beginPath();
            ctx.ellipse(cloudX, 120, 80, 40, 0, 0, Math.PI*2);
            ctx.ellipse(cloudX+50, 100, 60, 35, 0, 0, Math.PI*2);
            ctx.ellipse(cloudX-40, 105, 55, 32, 0, 0, Math.PI*2);
            ctx.fill();
        }
    }
    
    function drawGround() {
        // 地面渐变
        const grad = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + GROUND_H);
        grad.addColorStop(0, '#6B4E3A');
        grad.addColorStop(1, '#4A3222');
        ctx.fillStyle = grad;
        ctx.fillRect(0, GROUND_Y, LOGIC_W, GROUND_H);
        
        // 地面细节
        ctx.fillStyle = '#8B6E4A';
        for(let i = 0; i < 30; i++) {
            let x = (cameraX * 0.8 + i * 55) % LOGIC_W;
            ctx.fillRect(x, GROUND_Y + 5, 3, 6);
        }
        ctx.fillStyle = '#C4A265';
        ctx.fillRect(0, GROUND_Y, LOGIC_W, 3);
    }
    
    // 绘制三条辅助线（视觉参考）
    function drawGuideLines() {
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.setLineDash([8, 12]);
        ctx.lineWidth = 2;
        for(let i = 0; i < TRACK_POSITIONS.length; i++) {
            ctx.beginPath();
            ctx.moveTo(0, TRACK_POSITIONS[i]);
            ctx.lineTo(LOGIC_W, TRACK_POSITIONS[i]);
            if(i === 0) ctx.strokeStyle = '#ff6666';
            else if(i === 1) ctx.strokeStyle = '#66ff66';
            else ctx.strokeStyle = '#66aaff';
            ctx.stroke();
            // 标签
            ctx.font = "12px monospace";
            ctx.fillStyle = `rgba(255,255,200,0.6)`;
            ctx.fillText(TRACK_NAMES[i], 12, TRACK_POSITIONS[i] - 4);
        }
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        ctx.restore();
    }
    
    // ========== 生成逻辑（保证同轨道物品间距 >= 250）==========
    function isOverlapOnTrack(newX, trackIdx, minDist = 260) {
        for(let it of trackItems) {
            if(it.track === trackIdx && Math.abs(it.x - newX) < minDist) return true;
        }
        return false;
    }
    
    function generateChunk(startX) {
        let endX = startX + 900;
        
        // 为每条轨道生成物品
        for(let track = 0; track < 3; track++) {
            let itemCount = track === 0 ? 1 : (Math.random() > 0.4 ? 2 : 1);
            for(let i = 0; i < itemCount; i++) {
                let posX = startX + 120 + Math.random() * (750);
                if(isOverlapOnTrack(posX, track, 270)) continue;
                
                let baseY = TRACK_POSITIONS[track];
                let type = "";
                let value = 0;
                let w = 0, h = 0;
                
                if(track === 0) {
                    // 下轨：陷阱为主
                    let rand = Math.random();
                    if(rand < 0.6) {
                        type = "spike";
                        w = 48; h = 28;
                    } else if(rand < 0.85) {
                        lavaPits.push({ x: posX, y: baseY + 5, w: 55, h: 18, particles: [] });
                        continue;
                    } else {
                        springboards.push({ x: posX, y: baseY - 8, w: 52, h: 14, bouncePower: -16 });
                        continue;
                    }
                } else {
                    // 中轨/上轨：星星 + 道具 + 障碍物混合
                    let rand = Math.random();
                    if(rand < 0.55) {
                        type = "star";
                        w = 28; h = 28;
                        value = activeBuffs.doubleScore.active ? 200 : 100;
                    } else if(rand < 0.75) {
                        type = "moonBlock";
                        w = 48; h = 48;
                        value = 0;
                    } else if(rand < 0.88) {
                        type = "blocker";
                        w = 45; h = 42;
                    } else {
                        type = "star";
                        w = 28; h = 28;
                        value = activeBuffs.doubleScore.active ? 200 : 100;
                    }
                }
                
                if(type) {
                    trackItems.push({
                        x: posX, y: baseY - (h || 24), w: w, h: h,
                        type: type, track: track, collected: false, value: value
                    });
                }
            }
        }
        
        // 偶尔生成移动平台（高空点缀）
        if(Math.random() < 0.25) {
            movingPlatforms.push({
                x: startX + 200 + Math.random() * 500, y: 280 + Math.random() * 150,
                w: 90, h: 18, range: 70, speed: 0.7, startX: startX + 200, vx: 0
            });
        }
        
        return endX;
    }
    
    function generateInitialChunks() {
        trackItems = [];
        movingPlatforms = [];
        lavaPits = [];
        springboards = [];
        let currentX = 0;
        for(let i = 0; i < 3; i++) currentX = generateChunk(currentX);
        lastGeneratedX = currentX;
    }
    
    function updateGeneration() {
        let rightEdge = cameraX + LOGIC_W;
        if(rightEdge > lastGeneratedX - 400) lastGeneratedX = generateChunk(lastGeneratedX);
    }
    
    function cleanOldObjects() {
        let threshold = cameraX - 600;
        trackItems = trackItems.filter(it => it.x + it.w > threshold);
        movingPlatforms = movingPlatforms.filter(mp => mp.x + mp.w > threshold);
        lavaPits = lavaPits.filter(l => l.x + l.w > threshold);
        springboards = springboards.filter(s => s.x + s.w > threshold);
    }
    
    // ========== 物理与碰撞 ==========
    function collide(r1, r2) {
        return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
    }
    
    function updatePhysics() {
        let currentSpeed = activeBuffs.speed.active ? player.speed * 1.5 : player.speed;
        let move = (input.left ? -1 : 0) + (input.right ? 1 : 0);
        player.vx = move * currentSpeed;
        player.x += player.vx * gameSpeed;
        
        // 重力与跳跃
        player.vy += player.gravity * gameSpeed;
        player.y += player.vy * gameSpeed;
        player.onGround = false;
        
        // 地面碰撞
        let groundRect = { x: 0, y: GROUND_Y, w: LOGIC_W, h: GROUND_H };
        let pRect = { x: player.x, y: player.y, w: player.w, h: player.h };
        if(collide(pRect, groundRect)) {
            if(player.vy >= 0 && player.y + player.h - GROUND_Y <= GROUND_H + 10) {
                player.y = GROUND_Y - player.h;
                player.vy = 0;
                player.onGround = true;
                extraJump = activeBuffs.doubleJump.active ? 1 : 0;
            }
        }
        
        // 移动平台碰撞
        for(let mp of movingPlatforms) {
            let rect = { x: mp.x, y: mp.y, w: mp.w, h: mp.h };
            if(collide(pRect, rect)) {
                if(player.vy >= 0 && player.y + player.h - mp.y <= mp.h + 8) {
                    player.y = mp.y - player.h;
                    player.vy = 0;
                    player.onGround = true;
                    player.x += mp.vx * gameSpeed;
                    extraJump = activeBuffs.doubleJump.active ? 1 : 0;
                }
            }
        }
        
        // 弹簧
        for(let sb of springboards) {
            let rect = { x: sb.x, y: sb.y, w: sb.w, h: sb.h };
            if(collide(pRect, rect) && player.vy >= 0) {
                player.y = sb.y - player.h;
                player.vy = sb.bouncePower;
                player.onGround = true;
                playSound('spring', 0.14);
            }
        }
        
        // 跳跃
        if(input.jump && !activeBuffs.fly.active) {
            if(player.onGround) {
                player.vy = player.jumpPower;
                player.onGround = false;
                playSound('jump', 0.1);
                input.jump = false;
            } else if(activeBuffs.doubleJump.active && extraJump > 0) {
                player.vy = player.jumpPower;
                extraJump--;
                playSound('doubleJump', 0.12);
                input.jump = false;
            }
        }
        
        // 飞行模式
        if(activeBuffs.fly.active && input.jump) {
            player.vy = -5 * gameSpeed;
        }
        
        // 边界
        if(player.y + player.h > LOGIC_H + 100 || player.y < -100) gameOver();
        if(player.x < cameraX + 40) player.x = cameraX + 40;
        
        // 面向方向
        if(player.vx > 1) player.facingRight = true;
        if(player.vx < -1) player.facingRight = false;
    }
    
    function checkCollisions() {
        // 星星/道具收集
        for(let it of trackItems) {
            if(it.collected) continue;
            let rect = { x: it.x, y: it.y, w: it.w, h: it.h };
            if(collide({ x: player.x, y: player.y, w: player.w, h: player.h }, rect)) {
                if(it.type === 'star') {
                    score += it.value;
                    it.collected = true;
                    playSound('star', 0.12);
                } else if(it.type === 'moonBlock') {
                    let items = ['fly','magnet','shield','speed','doubleScore','doubleJump'];
                    let randItem = items[Math.floor(Math.random() * items.length)];
                    activateItem(randItem);
                    it.collected = true;
                } else if(it.type === 'blocker') {
                    if(activeBuffs.shield.active) {
                        playSound('shield', 0.15);
                        activeBuffs.shield.active = false;
                        it.collected = true;
                        updateItemTimersDisplay();
                    } else {
                        gameOver();
                        return;
                    }
                } else if(it.type === 'spike') {
                    if(activeBuffs.shield.active) {
                        playSound('shield', 0.15);
                        activeBuffs.shield.active = false;
                        it.collected = true;
                        updateItemTimersDisplay();
                    } else {
                        gameOver();
                        return;
                    }
                }
            }
        }
        
        // 熔岩
        for(let lava of lavaPits) {
            let rect = { x: lava.x, y: lava.y, w: lava.w, h: lava.h };
            if(collide({ x: player.x, y: player.y, w: player.w, h: player.h }, rect)) {
                if(activeBuffs.shield.active) {
                    playSound('shield', 0.15);
                    activeBuffs.shield.active = false;
                    lavaPits = lavaPits.filter(l => l !== lava);
                    updateItemTimersDisplay();
                } else {
                    gameOver();
                    return;
                }
            }
        }
    }
    
    function updateCamera() {
        let targetX = player.x - LOGIC_W / 2;
        if(targetX > cameraX) cameraX = targetX;
        if(cameraX < 0) cameraX = 0;
    }
    
    function updateMovingPlatforms() {
        for(let mp of movingPlatforms) {
            let oldX = mp.x;
            mp.x = mp.startX + Math.sin(Date.now() * 0.003 * mp.speed) * mp.range;
            mp.vx = mp.x - oldX;
        }
    }
    
    // ========== 音效与BUFF ==========
    function playSound(type, volume = 0.1) {
        if(!audioCtx || musicMuted) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.value = volume;
            osc.type = 'sine';
            if(type === 'jump') osc.frequency.value = 660;
            else if(type === 'star') osc.frequency.value = 880;
            else if(type === 'item') osc.frequency.value = 1046;
            else if(type === 'spring') osc.frequency.value = 540;
            else osc.frequency.value = 600;
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } catch(e) {}
    }
    
    const itemIcons = { fly: '🪽', magnet: '🧲', shield: '🛡️', speed: '⚡', doubleScore: '✨', doubleJump: '🦘' };
    function activateItem(type) {
        let now = Date.now(), duration = 5000;
        playSound('item', 0.12);
        switch(type) {
            case 'fly': activeBuffs.fly = { active: true, endTime: now + duration }; break;
            case 'magnet': activeBuffs.magnet = { active: true, endTime: now + duration }; break;
            case 'shield': activeBuffs.shield = { active: true, endTime: now + duration }; break;
            case 'speed': activeBuffs.speed = { active: true, endTime: now + duration, multiplier: 1.5 }; break;
            case 'doubleScore': activeBuffs.doubleScore = { active: true, endTime: now + duration }; break;
            case 'doubleJump': activeBuffs.doubleJump = { active: true, endTime: now + duration }; extraJump = 1; break;
        }
        updateItemTimersDisplay();
    }
    
    function updateItemTimersDisplay() {
        let now = Date.now();
        let activeList = [];
        for(let key in activeBuffs) {
            if(activeBuffs[key].active && activeBuffs[key].endTime > now) {
                activeList.push({ type: key, end: activeBuffs[key].endTime });
            }
        }
        itemTimerBar.innerHTML = activeList.map(b => {
            let remaining = Math.max(0, (b.end - now) / 1000);
            let percent = (remaining / 5) * 100;
            return `<div class="item-timer"><span class="item-timer-icon">${itemIcons[b.type] || '✨'}</span><div class="item-timer-bar-fill" style="width: ${percent}%;"></div><span>${Math.ceil(remaining)}s</span></div>`;
        }).join('');
    }
    
    function updateBuffs() {
        let now = Date.now();
        for(let k in activeBuffs) {
            if(activeBuffs[k].endTime && activeBuffs[k].endTime <= now) activeBuffs[k].active = false;
        }
        gameSpeed = 1.0;
        updateItemTimersDisplay();
    }
    
    // ========== 游戏流程 ==========
    function gameOver() {
        gameRunning = false;
        if(score > highScore) {
            highScore = score;
            localStorage.setItem('highScore', highScore);
        }
        finalScoreDisplay.textContent = `得分: ${Math.floor(score)}`;
        highScoreDisplay.textContent = `最高分: ${highScore}`;
        deathOverlay.style.display = 'flex';
        if(bgMusic) bgMusic.pause();
        triggerShake(10);
    }
    
    function triggerShake(intensity) { shakeAmount = intensity; }
    let shakeAmount = 0;
    function applyShake() { if(shakeAmount > 0) { ctx.save(); ctx.translate((Math.random()-0.5)*shakeAmount, (Math.random()-0.5)*shakeAmount); shakeAmount *= 0.85; if(shakeAmount<0.5) shakeAmount=0; return true; } return false; }
    function restoreShake() { if(shakeAmount===0) return; ctx.restore(); }
    
    function fullReset() {
        score = 0;
        cameraX = 0;
        gameSpeed = 1;
        extraJump = 0;
        player = {
            x: 200, y: GROUND_Y - PLAYER_H, w: PLAYER_W, h: PLAYER_H,
            vx: 0, vy: 0, speed: 6.2, jumpPower: -12.2,
            gravity: 0.62, onGround: true, facingRight: true
        };
        activeBuffs = {
            fly: { active: false, endTime: 0 }, magnet: { active: false, endTime: 0 },
            shield: { active: false, endTime: 0 }, speed: { active: false, endTime: 0, multiplier: 1.5 },
            doubleScore: { active: false, endTime: 0 }, doubleJump: { active: false, endTime: 0 }
        };
        generateInitialChunks();
        updateItemTimersDisplay();
        deathOverlay.style.display = 'none';
        gameRunning = true;
        if(bgMusic && !musicMuted) bgMusic.play().catch(e=>{});
    }
    
    function initBackgroundMusic() {
        try {
            bgMusic = new Audio('data:audio/mp3;base64,SUQzBAAAAAABEVRYWFgAAAAtU291bmRibGF6ZQwAAAAA');
            bgMusic.loop = true;
            bgMusic.volume = 0.2;
            bgMusic.muted = musicMuted;
            musicToggleBtn.textContent = musicMuted ? "🔇" : "🔊";
        } catch(e) {}
    }
    
    // 输入处理
    let input = { left: false, right: false, jump: false };
    const leftBtn = document.querySelector('.left-btn'), rightBtn = document.querySelector('.right-btn'), jumpBtn = document.querySelector('.jump-btn');
    function attachHandler(btn, key) {
        if(!btn) return;
        btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); input[key]=true; }, {passive:false});
        btn.addEventListener('touchend', (e)=>{ e.preventDefault(); input[key]=false; });
        btn.addEventListener('mousedown', ()=>{ input[key]=true; });
        btn.addEventListener('mouseup', ()=>{ input[key]=false; });
        btn.addEventListener('mouseleave', ()=>{ input[key]=false; });
    }
    attachHandler(leftBtn, 'left');
    attachHandler(rightBtn, 'right');
    attachHandler(jumpBtn, 'jump');
    window.addEventListener('keydown', (e)=>{
        if(e.key === 'ArrowLeft') { input.left=true; e.preventDefault(); }
        if(e.key === 'ArrowRight') { input.right=true; e.preventDefault(); }
        if(e.key === 'ArrowUp' || e.key === ' ') { input.jump=true; e.preventDefault(); }
    });
    window.addEventListener('keyup', (e)=>{
        if(e.key === 'ArrowLeft') input.left=false;
        if(e.key === 'ArrowRight') input.right=false;
        if(e.key === 'ArrowUp' || e.key === ' ') input.jump=false;
    });
    
    // 绘制所有物体
    function drawObjects() {
        for(let it of trackItems) {
            if(it.collected) continue;
            let x = it.x - cameraX;
            if(it.type === 'star') {
                ctx.fillStyle = "#FFD966";
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ffaa44";
                ctx.font = "32px monospace";
                ctx.fillText("⭐", x, it.y - 4);
            } else if(it.type === 'moonBlock') {
                ctx.fillStyle = "#AA88FF";
                ctx.fillRect(x, it.y, it.w, it.h);
                ctx.fillStyle = "#DDAAFF";
                ctx.fillRect(x+4, it.y+4, it.w-8, 8);
                ctx.font = "26px monospace";
                ctx.fillStyle = "#FFF9C4";
                ctx.fillText("🌙", x+12, it.y+38);
            } else if(it.type === 'blocker') {
                ctx.fillStyle = "#8B5A3A";
                ctx.fillRect(x, it.y, it.w, it.h);
                ctx.fillStyle = "#AA6E4A";
                ctx.fillRect(x+6, it.y+6, it.w-12, 6);
                ctx.fillStyle = "#5A3A2A";
                for(let i=0;i<3;i++) ctx.fillRect(x+8+i*12, it.y+18, 6, 14);
            } else if(it.type === 'spike') {
                ctx.fillStyle = "#7A4A2A";
                ctx.fillRect(x, it.y, it.w, it.h);
                ctx.fillStyle = "#C47A44";
                for(let i=0;i<4;i++) {
                    ctx.beginPath();
                    ctx.moveTo(x+i*it.w/4, it.y);
                    ctx.lineTo(x+i*it.w/4+8, it.y-14);
                    ctx.lineTo(x+i*it.w/4+16, it.y);
                    ctx.fill();
                }
            }
        }
        for(let lava of lavaPits) {
            ctx.fillStyle = "#FF5522";
            ctx.fillRect(lava.x-cameraX, lava.y, lava.w, lava.h);
            ctx.fillStyle = "#FF8844";
            ctx.fillRect(lava.x-cameraX+4, lava.y-3, lava.w-8, 4);
        }
        for(let sb of springboards) {
            ctx.fillStyle = "#FFAA55";
            ctx.fillRect(sb.x-cameraX, sb.y, sb.w, sb.h);
            ctx.fillStyle = "#FFDD88";
            ctx.fillRect(sb.x-cameraX+6, sb.y-4, sb.w-12, 5);
        }
        for(let mp of movingPlatforms) {
            ctx.fillStyle = "#77AAFF";
            ctx.fillRect(mp.x-cameraX, mp.y, mp.w, mp.h);
            ctx.fillStyle = "#AADDFF";
            ctx.fillRect(mp.x-cameraX+4, mp.y-4, mp.w-8, 6);
        }
        ctx.shadowBlur = 0;
    }
    
    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x - cameraX + player.w/2, player.y + player.h/2);
        if(!player.facingRight) ctx.scale(-1, 1);
        ctx.fillStyle = "#FFD8A0";
        ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
        ctx.fillStyle = "#F0A87A";
        ctx.fillRect(-player.w/2+8, -player.h/2-6, player.w-16, 10);
        ctx.fillStyle = "#4A2A1A";
        ctx.fillRect(-player.w/2+12, -player.h/2+12, 8, 8);
        ctx.fillRect(-player.w/2+32, -player.h/2+12, 8, 8);
        ctx.fillStyle = "#E08040";
        ctx.beginPath();
        ctx.ellipse(-player.w/2+26, -player.h/2+30, 8, 12, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }
    
    function drawUI() {
        ctx.fillStyle = "rgba(10,10,40,0.8)";
        ctx.fillRect(18, 65, 210, 52);
        ctx.fillStyle = "#FFD966";
        ctx.font = "30px monospace";
        ctx.fillText("⭐", 38, 105);
        ctx.fillStyle = "white";
        ctx.font = "bold 28px monospace";
        ctx.fillText(Math.floor(score), 92, 105);
        
        ctx.fillStyle = "rgba(10,10,40,0.8)";
        ctx.fillRect(LOGIC_W-228, 65, 210, 52);
        ctx.fillStyle = "#FFD966";
        ctx.fillText("🏆", LOGIC_W-200, 105);
        ctx.fillStyle = "white";
        ctx.fillText(highScore, LOGIC_W-150, 105);
    }
    
    let lastTimestamp = 0;
    function updateGame() {
        if(!gameRunning) return;
        updateBuffs();
        updatePhysics();
        checkCollisions();
        updateCamera();
        updateMovingPlatforms();
        updateGeneration();
        cleanOldObjects();
        updateItemTimersDisplay();
    }
    
    function gameLoop() {
        ctx.clearRect(0, 0, LOGIC_W, LOGIC_H);
        updateGame();
        let shook = applyShake();
        drawStyledBackground();
        drawGround();
        drawGuideLines();
        drawObjects();
        drawPlayer();
        drawUI();
        if(shook) restoreShake();
        requestAnimationFrame(gameLoop);
    }
    
    function initAudio() { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
    musicToggleBtn.addEventListener('click', () => {
        musicMuted = !musicMuted;
        if(bgMusic) bgMusic.muted = musicMuted;
        musicToggleBtn.textContent = musicMuted ? "🔇" : "🔊";
        playSound('button', 0.05);
    });
    
    function resizeCanvas() { canvas.width = LOGIC_W; canvas.height = LOGIC_H; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    // 启动
    let fakeLoad = setTimeout(() => {
        loadingOverlay.style.display = 'none';
        startOverlay.style.display = 'flex';
        resourcesLoaded = true;
    }, 500);
    
    startBtn.addEventListener('click', () => {
        if(!resourcesLoaded) return;
        initAudio();
        initBackgroundMusic();
        fullReset();
        startOverlay.style.display = 'none';
        bottomControls.style.display = 'flex';
        gameRunning = true;
        if(bgMusic && !musicMuted) bgMusic.play().catch(e=>{});
    });
    restartBtn.addEventListener('click', () => {
        fullReset();
        deathOverlay.style.display = 'none';
        bottomControls.style.display = 'flex';
        gameRunning = true;
        if(bgMusic && !musicMuted) bgMusic.play().catch(e=>{});
    });
    
    generateInitialChunks();
    gameLoop();
})();
</script>
</body>
</html>
